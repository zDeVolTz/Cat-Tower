<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cat Tower Stack</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #1a1625;
    touch-action: manipulation; -webkit-user-select: none; user-select: none;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #gameCanvas { display: block; width: 100%; height: 100%; }
  #ui {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .panel {
    pointer-events: auto;
    background: rgba(30, 22, 40, 0.92);
    border: 2px solid #ffb6d9;
    border-radius: 24px;
    padding: 28px 32px;
    text-align: center;
    color: #fff5fa;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    max-width: 320px;
  }
  .panel h1 { margin: 0 0 6px; font-size: 28px; color: #ffd1e8; }
  .panel p { margin: 6px 0 18px; font-size: 14px; opacity: 0.85; line-height: 1.4; }
  .btn {
    pointer-events: auto;
    background: linear-gradient(135deg, #ff9ec7, #ff6fa5);
    border: none; border-radius: 16px;
    color: #2a1520; font-weight: 700; font-size: 17px;
    padding: 14px 30px; cursor: pointer;
    box-shadow: 0 4px 0 #c2477e;
    transition: transform 0.05s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #c2477e; }
  .hidden { display: none !important; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 16px 18px; pointer-events: none;
  }
  #scoreWrap { display: flex; flex-direction: column; align-items: flex-start; }
  #score { font-size: 34px; font-weight: 800; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,0.5); line-height: 1; }
  #floorLabel { font-size: 13px; font-weight: 700; color: #ffd1e8; opacity: 0.9; margin-top: 4px; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
  #muteBtn {
    pointer-events: auto; width: 42px; height: 42px; border-radius: 50%;
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
    color: #fff; font-size: 18px; cursor: pointer;
  }
  #powerRow {
    position: fixed; top: 76px; left: 18px; display: flex; gap: 6px; pointer-events: none;
  }
  .pchip {
    background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.4);
    border-radius: 12px; padding: 4px 9px; font-size: 13px; color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="hud">
  <div id="scoreWrap">
    <div id="score">0</div>
    <div id="floorLabel">Этаж 0</div>
  </div>
  <button id="muteBtn">🔊</button>
</div>
<div id="powerRow"></div>

<div id="ui">
  <div class="panel" id="startPanel">
    <h1>🐱 Кото-Башня</h1>
    <p>Стройте башню из котиков как можно выше! Тапните, чтобы уронить блок точно на предыдущий. Ловите подарки 🎁 и золотых котов ⭐, открывайте новых котиков по мере роста башни!</p>
    <button class="btn" id="startBtn">Играть</button>
  </div>

  <div class="panel hidden" id="overPanel">
    <h1>Башня рухнула!</h1>
    <p id="finalScoreText">Счёт: 0</p>
    <p id="floorReachedText">Этаж: 0</p>
    <p id="bestScoreText">Рекорд: 0</p>
    <button class="btn" id="restartBtn">Ещё раз</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* =========================================================
     1. YOUTUBE PLAYABLES SDK INTEGRATION LAYER
     Real SDK: window.ytgame (injected by the YouTube host page).
     Falls back to local-only mode so the game is fully testable
     in a plain browser during development.
     Reference used: developers.google.com/youtube/gaming/playables/reference/sdk
     ========================================================= */
  const InPlayables = typeof window.ytgame !== "undefined";

  const Platform = {
    firstFrameReady() {
      if (InPlayables) window.ytgame.game.firstFrameReady();
    },
    gameReady() {
      if (InPlayables) window.ytgame.game.gameReady();
    },
    isAudioEnabled() {
      if (InPlayables) {
        try { return window.ytgame.system.isAudioEnabled(); } catch (e) { return true; }
      }
      return true;
    },
    sendScore(score) {
      if (InPlayables) {
        try { window.ytgame.engagement.sendScore({ score }); } catch (e) {}
      }
    },
    saveData(data) {
      const json = JSON.stringify(data);
      if (InPlayables) {
        try { window.ytgame.game.saveData(json); return; } catch (e) {}
      }
      try { localStorage.setItem("catTowerSave", json); } catch (e) {}
    },
    async loadData() {
      if (InPlayables) {
        try {
          const raw = await window.ytgame.game.loadData();
          if (raw) return JSON.parse(raw);
        } catch (e) {}
      }
      try {
        const raw = localStorage.getItem("catTowerSave");
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return null;
    }
  };

  /* =========================================================
     2. CANVAS SETUP (responsive, portrait-first as required)
     ========================================================= */
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  /* =========================================================
     3. AUDIO — tiny self-contained WebAudio beeps.
     No external files / network calls (Playables-safe).
     ========================================================= */
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    } else if (audioCtx.state === "suspended") {
      audioCtx.resume().catch(() => {});
    }
  }
  function beep(freq, duration, type) {
    if (muted || !audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || "sine";
      osc.frequency.value = freq;
      gain.gain.value = 0.12;
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

  /* =========================================================
     4. CONFIG — block types, gifts, themes
     ========================================================= */
  const BLOCK_H = 46;
  const PERFECT_TOLERANCE_BASE = 8;

  const BLOCK_TYPES = {
    normal: {
      id: "normal", label: "Обычный",
      palette: ["#ffb6d9", "#c9b7ff", "#ffe08a", "#9fe8c8", "#ffb0a0", "#a8d8ff"],
      toleranceDelta: 0, speedMult: 1, scoreMult: 1, unlockFloor: 0
    },
    light: {
      id: "light", label: "Пушистик",
      palette: ["#fdf6e3", "#fff0f5", "#f0faff"],
      toleranceDelta: 5, speedMult: 0.88, scoreMult: 1, unlockFloor: 4
    },
    heavy: {
      id: "heavy", label: "Тяжеловес",
      palette: ["#c98f5e", "#b87a4a", "#a56a3e"],
      toleranceDelta: 0, speedMult: 0.8, scoreMult: 2, unlockFloor: 7
    },
    slippery: {
      id: "slippery", label: "Скользкий",
      palette: ["#7fd8e8", "#5fc2d6", "#a0e8f0"],
      toleranceDelta: -4, speedMult: 1.25, scoreMult: 1.5, unlockFloor: 11
    },
    sticky: {
      id: "sticky", label: "Липучка",
      palette: ["#a8d878", "#8fc75f", "#c2e896"],
      toleranceDelta: 8, speedMult: 0.95, scoreMult: 0.9, unlockFloor: 15
    }
  };
  const UNLOCK_ORDER = ["light", "heavy", "slippery", "sticky"];

  const GIFT_TYPES = ["magnet", "freeze", "shield"];
  const GIFT_INFO = {
    magnet: { icon: "🧲", label: "Магнит" },
    freeze: { icon: "❄️", label: "Заморозка" },
    shield: { icon: "🛡️", label: "Щит" }
  };

  const THEMES = [
    { name: "Уютный чердак", from: "#2b2140", to: "#4a2f55", deco: "windows", accent: "#ffd1e8" },
    { name: "Солнечный двор", from: "#8ec9ea", to: "#cdeafd", deco: "clouds", accent: "#fff4d6" },
    { name: "Закат", from: "#ff9a6c", to: "#7d4a8c", deco: "birds", accent: "#ffe3b3" },
    { name: "Ночное небо", from: "#0d1233", to: "#1e2a5e", deco: "stars", accent: "#cfd8ff" },
    { name: "Космос", from: "#050414", to: "#1a0d33", deco: "space", accent: "#b98bff" }
  ];

  /* =========================================================
     5. GAME STATE
     ========================================================= */
  let state = "menu"; // menu | playing | paused | over
  let blocks = [];
  let debris = [];
  let particles = [];
  let floatingTexts = [];
  let mover = null;
  let cameraY = 0;
  let score = 0;
  let best = 0;
  let combo = 0;
  let muted = !Platform.isAudioEnabled();

  let magnetCharges = 0;
  let freezeCharges = 0;
  let shieldCharges = 0;
  let giftCounter = 0;
  let giftThreshold = 8;
  let lastMilestoneFloor = 0;
  let milestoneBanner = null;
  let shakeMag = 0;
  let UNLOCK_ANNOUNCED = {};

  function baseWidth() { return Math.min(W * 0.42, 170); }

  function resetGame() {
    blocks = [{ x: W / 2 - baseWidth() / 2, width: baseWidth(), y: 0, color: "#f4e4c1", typeId: "normal", isGolden: false }];
    debris = [];
    particles = [];
    floatingTexts = [];
    cameraY = 0;
    score = 0;
    combo = 0;
    magnetCharges = 0;
    freezeCharges = 0;
    shieldCharges = 0;
    giftCounter = 0;
    giftThreshold = 8 + Math.floor(Math.random() * 4);
    lastMilestoneFloor = 0;
    milestoneBanner = null;
    shakeMag = 0;
    UNLOCK_ANNOUNCED = {};
    spawnMover();
    updateHUD();
  }

  function spawnMover() {
    const top = blocks[blocks.length - 1];
    const floor = blocks.length - 1;

    // announce newly-unlocked cat types
    for (const id of UNLOCK_ORDER) {
      if (floor === BLOCK_TYPES[id].unlockFloor && !UNLOCK_ANNOUNCED[id]) {
        UNLOCK_ANNOUNCED[id] = true;
        milestoneBanner = { text: "Новый кот: " + BLOCK_TYPES[id].label + "!", life: 1800, maxLife: 1800 };
        beep(660, 0.1, "triangle");
        setTimeout(() => beep(880, 0.12, "triangle"), 80);
      }
    }

    giftCounter++;
    let kind = "normal";
    let giftType = null;
    let chosenTypeId = "normal";
    let isGolden = false;

    if (floor >= 6 && giftCounter >= giftThreshold) {
      kind = "gift";
      giftType = GIFT_TYPES[Math.floor(Math.random() * GIFT_TYPES.length)];
      giftCounter = 0;
      giftThreshold = 7 + Math.floor(Math.random() * 5);
    } else {
      const goldenChance = Math.min(0.06 + floor * 0.002, 0.15);
      isGolden = Math.random() < goldenChance;

      const pool = ["normal"];
      for (const id of UNLOCK_ORDER) {
        if (floor >= BLOCK_TYPES[id].unlockFloor) pool.push(id);
      }
      if (pool.length > 1) {
        chosenTypeId = Math.random() < 0.5 ? "normal" : pool[1 + Math.floor(Math.random() * (pool.length - 1))];
      }
    }

    const fromLeft = blocks.length % 2 === 0;
    let speed;
    if (kind === "gift") {
      speed = Math.min(1.8 + floor * 0.04, 5);
    } else {
      const t = BLOCK_TYPES[chosenTypeId];
      speed = Math.min(2.0 + floor * 0.05, 8) * t.speedMult;
      if (freezeCharges > 0) { speed *= 0.5; freezeCharges--; updateHUD(); }
    }

    const type = BLOCK_TYPES[chosenTypeId] || BLOCK_TYPES.normal;
    const color = type.palette[blocks.length % type.palette.length];

    mover = {
      kind, giftType, typeId: chosenTypeId, isGolden,
      x: fromLeft ? -top.width : W,
      width: top.width,
      y: top.y + BLOCK_H,
      dir: fromLeft ? 1 : -1,
      speed,
      color
    };
  }

  /* =========================================================
     6. INPUT: drop the moving block
     ========================================================= */
  function drop() {
    if (state !== "playing" || !mover) return;

    if (mover.kind === "gift") {
      handleGiftDrop();
      return;
    }

    const top = blocks[blocks.length - 1];
    const type = BLOCK_TYPES[mover.typeId] || BLOCK_TYPES.normal;

    if (magnetCharges > 0) {
      mover.x = top.x;
      magnetCharges--;
    }

    const overlapStart = Math.max(top.x, mover.x);
    const overlapEnd = Math.min(top.x + top.width, mover.x + mover.width);
    const overlapWidth = overlapEnd - overlapStart;
    const screenMidY = () => H - 60 - (mover.y - cameraY) - BLOCK_H / 2;

    if (overlapWidth <= 4) {
      if (shieldCharges > 0) {
        shieldCharges--;
        const placed = { x: top.x, width: top.width, y: mover.y, typeId: "normal", isGolden: false,
          color: BLOCK_TYPES.normal.palette[blocks.length % BLOCK_TYPES.normal.palette.length] };
        blocks.push(placed);
        combo = 0;
        score += 1;
        triggerShake(10);
        spawnFloatingText(W / 2, H * 0.35, "Спасён! 🛡️", "#9fe8ff", 22);
        spawnParticles(placed.x + placed.width / 2, screenMidY(), 18, ["#9fe8ff", "#ffffff"], 3, 500);
        beep(220, 0.12, "sine"); setTimeout(() => beep(440, 0.14, "sine"), 90);
        updateHUD();
        if (placed.y - cameraY > H * 0.55) cameraY = placed.y - H * 0.55;
        checkMilestone();
        spawnMover();
        return;
      }
      gameOver();
      return;
    }

    const tol = Math.max(3, PERFECT_TOLERANCE_BASE + type.toleranceDelta);
    const isPerfect = Math.abs(overlapWidth - top.width) <= tol || Math.abs(mover.x - top.x) <= tol;

    let placed;
    if (isPerfect) {
      placed = { x: top.x, width: top.width, y: mover.y, typeId: mover.typeId, isGolden: mover.isGolden, color: mover.color };
      combo++;
      spawnFloatingText(placed.x + placed.width / 2, screenMidY(), combo >= 2 ? ("ИДЕАЛЬНО! ×" + combo) : "ИДЕАЛЬНО!", "#ffe08a", 18);
      spawnParticles(placed.x + placed.width / 2, screenMidY(), 14, [type.palette[0], "#ffffff"], 2.5, 450);
      beep(500 + Math.min(combo, 10) * 30, 0.09, "triangle");
    } else {
      placed = { x: overlapStart, width: overlapWidth, y: mover.y, typeId: mover.typeId, isGolden: mover.isGolden, color: mover.color };
      combo = 0;
      if (mover.x < overlapStart) spawnDebris(mover.x, mover.y, overlapStart - mover.x, mover.color, -1);
      if (mover.x + mover.width > overlapEnd) spawnDebris(overlapEnd, mover.y, (mover.x + mover.width) - overlapEnd, mover.color, 1);
      triggerShake(type.id === "heavy" ? 6 : 3);
      beep(180, 0.1, "sawtooth");
    }

    let gained = 1;
    if (combo >= 2) gained += combo;
    gained = Math.round(gained * type.scoreMult * (mover.isGolden ? 2 : 1));
    score += gained;

    if (mover.isGolden) {
      spawnFloatingText(placed.x + placed.width / 2, screenMidY() - 24, "⭐ +" + gained, "#ffd54a", 20);
      spawnParticles(placed.x + placed.width / 2, screenMidY(), 20, ["#ffd54a", "#fff3c4"], 3.5, 500);
      beep(700, 0.08, "triangle"); setTimeout(() => beep(900, 0.1, "triangle"), 70);
    } else if (!isPerfect) {
      spawnFloatingText(placed.x + placed.width / 2, screenMidY(), "+" + gained, "#ffffff", 16);
    } else {
      spawnFloatingText(placed.x + placed.width / 2, screenMidY() - 20, "+" + gained, "#ffe08a", 16);
    }

    blocks.push(placed);
    updateHUD();

    if (placed.y - cameraY > H * 0.55) cameraY = placed.y - H * 0.55;
    checkMilestone();
    spawnMover();
  }

  function handleGiftDrop() {
    const top = blocks[blocks.length - 1];
    const placed = { x: top.x, width: top.width, y: mover.y, typeId: "normal", isGolden: false,
      color: BLOCK_TYPES.normal.palette[blocks.length % BLOCK_TYPES.normal.palette.length] };
    blocks.push(placed);

    const info = GIFT_INFO[mover.giftType];
    const sy = H - 60 - (placed.y - cameraY) - BLOCK_H / 2;

    if (mover.giftType === "magnet") {
      magnetCharges = 1;
    } else if (mover.giftType === "freeze") {
      freezeCharges = 3;
    } else if (mover.giftType === "shield") {
      if (shieldCharges >= 1) {
        score += 5;
        spawnFloatingText(W / 2, sy, "Щит уже есть! +5", "#ffffff", 15);
      } else {
        shieldCharges = 1;
      }
    }

    spawnFloatingText(W / 2, sy - 10, info.icon + " " + info.label + "!", "#ffffff", 18);
    spawnParticles(placed.x + placed.width / 2, sy, 16, ["#ffffff", "#ffd1e8"], 3, 450);
    beep(600, 0.08, "square"); setTimeout(() => beep(800, 0.1, "square"), 70);

    updateHUD();
    if (placed.y - cameraY > H * 0.55) cameraY = placed.y - H * 0.55;
    checkMilestone();
    spawnMover();
  }

  function checkMilestone() {
    const floor = blocks.length - 1;
    if (floor > 0 && floor % 10 === 0 && floor !== lastMilestoneFloor) {
      lastMilestoneFloor = floor;
      const themeIdx = Math.min(Math.floor(floor / 10), THEMES.length - 1);
      milestoneBanner = { text: "Этаж " + floor + "! " + THEMES[themeIdx].name, life: 2200, maxLife: 2200 };
      triggerShake(8);
      spawnParticles(W / 2, H * 0.3, 30, [THEMES[themeIdx].accent, "#ffffff"], 4, 900);
      beep(523, 0.12, "triangle");
      setTimeout(() => beep(659, 0.14, "triangle"), 90);
      setTimeout(() => beep(784, 0.16, "triangle"), 180);
    }
  }

  function spawnDebris(x, y, width, color, dir) {
    debris.push({
      x, y, width, height: BLOCK_H, color,
      vx: dir * (1.5 + Math.random() * 1.5),
      vy: -2, rot: 0, vrot: dir * 0.06
    });
  }

  function spawnParticles(x, y, count, colors, speedMax, life) {
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 0.5 + Math.random() * speedMax;
      particles.push({
        x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 1,
        life, maxLife: life, size: 2 + Math.random() * 3,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }
  }

  function spawnFloatingText(x, y, text, color, size) {
    floatingTexts.push({ x, y, text, color, size, life: 1000, maxLife: 1000 });
  }

  function triggerShake(amount) {
    shakeMag = Math.max(shakeMag, amount);
  }

  function gameOver() {
    state = "over";
    best = Math.max(best, score);
    Platform.sendScore(score);
    Platform.saveData({ best });
    const floorReached = Math.max(0, blocks.length - 1);
    document.getElementById("finalScoreText").textContent = "Счёт: " + score;
    document.getElementById("floorReachedText").textContent = "Этаж: " + floorReached;
    document.getElementById("bestScoreText").textContent = "Рекорд: " + best;
    document.getElementById("overPanel").classList.remove("hidden");
    beep(300, 0.15, "sawtooth");
    setTimeout(() => beep(180, 0.25, "sawtooth"), 100);
  }

  function updateHUD() {
    document.getElementById("score").textContent = score;
    document.getElementById("floorLabel").textContent = "Этаж " + Math.max(0, blocks.length - 1);
    const parts = [];
    if (magnetCharges > 0) parts.push('<span class="pchip">🧲' + (magnetCharges > 1 ? ("×" + magnetCharges) : "") + '</span>');
    if (freezeCharges > 0) parts.push('<span class="pchip">❄️×' + freezeCharges + '</span>');
    if (shieldCharges > 0) parts.push('<span class="pchip">🛡️</span>');
    document.getElementById("powerRow").innerHTML = parts.join("");
  }

  /* =========================================================
     7. UPDATE LOOP
     ========================================================= */
  let lastT = 0;
  function update(dt) {
    if (state !== "playing") {
      // still decay shake/particles a bit for smoothness even when paused/over
    }
    const k = dt * 60 / 1000;

    if (state === "playing" && mover) {
      mover.x += mover.dir * mover.speed * k;
      const leftLimit = -mover.width * 0.9;
      const rightLimit = W - mover.width * 0.1;
      if (mover.x < leftLimit) { mover.x = leftLimit; mover.dir = 1; }
      if (mover.x > rightLimit) { mover.x = rightLimit; mover.dir = -1; }

      if (mover.isGolden && Math.random() < 0.25) {
        const sy = H - 60 - (mover.y - cameraY) - BLOCK_H / 2;
        spawnParticles(mover.x + mover.width / 2, sy, 1, ["#ffe08a", "#fff3c4"], 1, 400);
      }
    }

    for (let i = debris.length - 1; i >= 0; i--) {
      const d = debris[i];
      d.vy += 0.35;
      d.x += d.vx * k;
      d.y += d.vy * k;
      d.rot += d.vrot * k;
      if (d.y - cameraY > H + 200) debris.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * k;
      p.y += p.vy * k;
      p.vy += 0.1 * k;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const f = floatingTexts[i];
      f.y -= 0.5 * k;
      f.life -= dt;
      if (f.life <= 0) floatingTexts.splice(i, 1);
    }

    if (shakeMag > 0.2) shakeMag *= 0.88; else shakeMag = 0;

    if (milestoneBanner) {
      milestoneBanner.life -= dt;
      if (milestoneBanner.life <= 0) milestoneBanner = null;
    }
  }

  /* =========================================================
     8. RENDER
     ========================================================= */
  const decorCache = {};
  function getDecor(themeIdx) {
    if (decorCache[themeIdx]) return decorCache[themeIdx];
    const arr = [];
    let seed = themeIdx * 97 + 13;
    function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for (let i = 0; i < 9; i++) {
      arr.push({ relX: rnd(), relY: rnd() * 0.5, size: 10 + rnd() * 22, speed: 6 + rnd() * 14, phase: rnd() * Math.PI * 2 });
    }
    decorCache[themeIdx] = arr;
    return arr;
  }

  function drawDecorations(theme, themeIdx, timeSec) {
    const items = getDecor(themeIdx);
    for (const it of items) {
      const x = ((it.relX * (W + 120) + timeSec * it.speed) % (W + 120)) - 60;
      const y = it.relY * H * 0.6 + 20;
      ctx.save();
      if (theme.deco === "windows") {
        ctx.globalAlpha = 0.12 + 0.08 * Math.sin(timeSec + it.phase);
        ctx.fillStyle = theme.accent;
        roundRect(x, y, it.size * 0.7, it.size, 4);
        ctx.fill();
      } else if (theme.deco === "clouds") {
        ctx.globalAlpha = 0.75;
        ctx.fillStyle = "rgba(255,255,255,0.75)";
        ctx.beginPath();
        ctx.ellipse(x, y, it.size, it.size * 0.6, 0, 0, Math.PI * 2);
        ctx.ellipse(x + it.size * 0.6, y + 3, it.size * 0.7, it.size * 0.45, 0, 0, Math.PI * 2);
        ctx.fill();
      } else if (theme.deco === "birds") {
        ctx.globalAlpha = 0.5;
        ctx.strokeStyle = "rgba(40,20,30,0.6)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x - 6, y); ctx.quadraticCurveTo(x - 3, y - 5, x, y);
        ctx.quadraticCurveTo(x + 3, y - 5, x + 6, y);
        ctx.stroke();
      } else if (theme.deco === "stars") {
        ctx.globalAlpha = 0.4 + 0.4 * Math.sin(timeSec * 2 + it.phase);
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(x, y, 2.2, 0, Math.PI * 2);
        ctx.fill();
      } else if (theme.deco === "space") {
        const big = it.size > 25;
        ctx.globalAlpha = big ? 0.5 : (0.3 + 0.4 * Math.sin(timeSec * 2 + it.phase));
        ctx.fillStyle = big ? theme.accent : "#fff";
        ctx.beginPath();
        ctx.arc(x, y, big ? it.size * 0.3 : 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawBlockShape(x, screenY, width, color, typeId, isGolden, withFace, timeSec) {
    const h = BLOCK_H;
    let drawY = screenY;
    if (typeId === "light") drawY += Math.sin(timeSec * 4 + x * 0.05) * 2;

    ctx.save();

    if (isGolden) {
      const g = ctx.createLinearGradient(x, drawY, x, drawY + h);
      g.addColorStop(0, "#fff3b0");
      g.addColorStop(1, "#ffc94a");
      ctx.fillStyle = g;
    } else {
      ctx.fillStyle = color;
    }
    roundRect(x, drawY, width, h, 10);
    ctx.fill();

    if (isGolden) {
      ctx.strokeStyle = "rgba(255,255,255,0.8)";
      ctx.lineWidth = 2;
      roundRect(x + 1, drawY + 1, width - 2, h - 2, 9);
      ctx.stroke();
    }

    if (typeId === "heavy") {
      ctx.strokeStyle = "rgba(0,0,0,0.25)";
      ctx.lineWidth = 3;
      roundRect(x, drawY, width, h, 10);
      ctx.stroke();
    } else if (typeId === "slippery") {
      ctx.save();
      ctx.beginPath();
      roundRect(x, drawY, width, h, 10);
      ctx.clip();
      ctx.fillStyle = "rgba(255,255,255,0.35)";
      ctx.beginPath();
      ctx.moveTo(x + width * 0.1, drawY);
      ctx.lineTo(x + width * 0.35, drawY);
      ctx.lineTo(x + width * 0.15, drawY + h);
      ctx.lineTo(x - width * 0.1, drawY + h);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    } else if (typeId === "sticky" && width > 20) {
      ctx.fillStyle = color;
      for (let dx = width * 0.2; dx < width; dx += width * 0.3) {
        ctx.beginPath();
        ctx.ellipse(x + dx, drawY + h, 4, 6, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    const earSize = Math.min(16, width * 0.22) * (typeId === "heavy" ? 1.15 : 1);
    ctx.fillStyle = isGolden ? "#ffc94a" : color;
    ctx.beginPath();
    ctx.moveTo(x + width * 0.15, drawY);
    ctx.lineTo(x + width * 0.15 + earSize * 0.6, drawY - earSize);
    ctx.lineTo(x + width * 0.15 + earSize * 1.2, drawY);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + width * 0.85 - earSize * 1.2, drawY);
    ctx.lineTo(x + width * 0.85 - earSize * 0.6, drawY - earSize);
    ctx.lineTo(x + width * 0.85, drawY);
    ctx.closePath();
    ctx.fill();

    if (typeId === "light" && width > 30) {
      ctx.fillStyle = "rgba(255,255,255,0.6)";
      for (let dx = width * 0.15; dx < width * 0.9; dx += width * 0.2) {
        ctx.beginPath();
        ctx.moveTo(x + dx, drawY);
        ctx.lineTo(x + dx + 4, drawY - 5);
        ctx.lineTo(x + dx + 8, drawY);
        ctx.closePath();
        ctx.fill();
      }
    }

    if (withFace && width > 30) {
      ctx.fillStyle = "rgba(40,20,30,0.75)";
      const ey = drawY + h * 0.45;
      ctx.beginPath();
      ctx.arc(x + width * 0.38, ey, 2.4, 0, Math.PI * 2);
      ctx.arc(x + width * 0.62, ey, 2.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x + width * 0.5 - 4, ey + 7);
      ctx.lineTo(x + width * 0.5 + 4, ey + 7);
      ctx.lineTo(x + width * 0.5, ey + 10);
      ctx.closePath();
      ctx.fill();
    }

    ctx.restore();
  }

  function drawGiftBlock(x, screenY, width, giftType, timeSec) {
    const h = BLOCK_H;
    const bob = Math.sin(timeSec * 5) * 2;
    const gy = screenY + bob;
    ctx.save();
    const grad = ctx.createLinearGradient(x, gy, x, gy + h);
    grad.addColorStop(0, "#ffffff");
    grad.addColorStop(1, "#ffe1f0");
    ctx.fillStyle = grad;
    roundRect(x, gy, width, h, 10);
    ctx.fill();
    ctx.strokeStyle = "#ff8fc0";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x + width / 2, gy); ctx.lineTo(x + width / 2, gy + h);
    ctx.moveTo(x, gy + h / 2); ctx.lineTo(x + width, gy + h / 2);
    ctx.stroke();
    ctx.font = "22px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(GIFT_INFO[giftType].icon, x + width / 2, gy + h / 2);
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function render(t) {
    const timeSec = t / 1000;
    const themeIdx = Math.min(Math.floor(Math.max(0, blocks.length - 1) / 10), THEMES.length - 1);
    const theme = THEMES[themeIdx];

    ctx.save();
    const sx = shakeMag > 0 ? (Math.random() - 0.5) * shakeMag : 0;
    const sy = shakeMag > 0 ? (Math.random() - 0.5) * shakeMag : 0;
    ctx.translate(sx, sy);

    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, theme.from);
    grad.addColorStop(1, theme.to);
    ctx.fillStyle = grad;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    drawDecorations(theme, themeIdx, timeSec);

    for (let i = 0; i < blocks.length; i++) {
      const b = blocks[i];
      const screenY = H - 60 - (b.y - cameraY) - BLOCK_H;
      if (screenY > H + BLOCK_H || screenY < -BLOCK_H) continue;
      drawBlockShape(b.x, screenY, b.width, b.color, b.typeId, b.isGolden, i === blocks.length - 1, timeSec);
    }

    for (const d of debris) {
      const screenY = H - 60 - (d.y - cameraY) - BLOCK_H;
      ctx.save();
      ctx.translate(d.x + d.width / 2, screenY + BLOCK_H / 2);
      ctx.rotate(d.rot);
      ctx.fillStyle = d.color;
      roundRect(-d.width / 2, -BLOCK_H / 2, d.width, BLOCK_H, 8);
      ctx.fill();
      ctx.restore();
    }

    if (mover && state === "playing") {
      const screenY = H - 60 - (mover.y - cameraY) - BLOCK_H;
      if (mover.kind === "gift") {
        drawGiftBlock(mover.x, screenY, mover.width, mover.giftType, timeSec);
      } else {
        drawBlockShape(mover.x, screenY, mover.width, mover.color, mover.typeId, mover.isGolden, true, timeSec);
      }
    }

    for (const p of particles) {
      const a = Math.max(0, p.life / p.maxLife);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const f of floatingTexts) {
      const a = Math.max(0, f.life / f.maxLife);
      ctx.globalAlpha = a;
      ctx.fillStyle = f.color;
      ctx.font = "bold " + f.size + "px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;

    if (combo >= 2 && state === "playing") {
      ctx.fillStyle = "#ffe08a";
      ctx.font = "bold 16px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Комбо ×" + combo + "!", W / 2, 90);
    }

    if (milestoneBanner) {
      const mb = milestoneBanner;
      let a = 1;
      if (mb.life > mb.maxLife - 300) a = (mb.maxLife - mb.life) / 300;
      else if (mb.life < 400) a = mb.life / 400;
      ctx.globalAlpha = Math.max(0, Math.min(1, a));
      ctx.fillStyle = "rgba(0,0,0,0.4)";
      roundRect(W / 2 - 150, H * 0.32 - 26, 300, 52, 16);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "bold 17px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(mb.text, W / 2, H * 0.32 + 6);
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  /* =========================================================
     9. MAIN LOOP
     ========================================================= */
  function loop(t) {
    const dt = lastT ? t - lastT : 16;
    lastT = t;
    update(dt);
    render(t);
    requestAnimationFrame(loop);
  }

  /* =========================================================
     10. PAUSE / RESUME (platform lifecycle requirement)
     ========================================================= */
  let prevStateBeforePause = null;
  function pauseGame() {
    if (state === "playing") {
      prevStateBeforePause = "playing";
      state = "paused";
    }
  }
  function resumeGame() {
    if (state === "paused" && prevStateBeforePause === "playing") {
      state = "playing";
    }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) pauseGame(); else resumeGame();
  });
  window.addEventListener("blur", pauseGame);
  window.addEventListener("focus", resumeGame);

  /* =========================================================
     11. UI WIRING
     ========================================================= */
  const startPanel = document.getElementById("startPanel");
  const overPanel = document.getElementById("overPanel");
  const muteBtn = document.getElementById("muteBtn");

  document.getElementById("startBtn").addEventListener("click", () => {
    ensureAudio();
    startPanel.classList.add("hidden");
    resetGame();
    state = "playing";
  });
  document.getElementById("restartBtn").addEventListener("click", () => {
    ensureAudio();
    overPanel.classList.add("hidden");
    resetGame();
    state = "playing";
  });
  muteBtn.addEventListener("click", () => {
    muted = !muted;
    muteBtn.textContent = muted ? "🔇" : "🔊";
  });

  canvas.addEventListener("pointerdown", () => {
    ensureAudio();
    if (state === "playing") drop();
  });
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" && state === "playing") { ensureAudio(); drop(); }
  });

  /* =========================================================
     12. BOOT SEQUENCE (SDK-compliant loading lifecycle)
     ========================================================= */
  async function boot() {
    Platform.firstFrameReady(); // splash/loading screen is now shown (start panel)
    const saved = await Platform.loadData();
    if (saved && typeof saved.best === "number") best = saved.best;
    resize();
    requestAnimationFrame(loop);
    Platform.gameReady(); // interactive now (start panel with button is showing)
  }

  boot();
})();
</script>
</body>
</html>
