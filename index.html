<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1625">
  <title>Кото-Башня | Mobile Game</title>
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div id="scoreWrap">
      <div id="score">0</div>
      <div id="floorLabel">Этаж 0</div>
      <div id="levelBadge">Уровень 1</div>
    </div>
    <div id="audioControls">
      <div class="music-control-wrap">
        <button id="musicBtn" aria-label="Музыка и Звуки" title="Фоновая музыка и звуки">🎵</button>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.02" value="0.10" aria-label="Громкость" title="Регулятор громкости">
      </div>
    </div>
  </div>

  <div id="powerRow"></div>

  <div id="ui">
    <div class="panel" id="startPanel">
      <h1>🐱 Кото-Башня</h1>
      <p>Стройте башню из котиков как можно выше! Цельтесь точно — идеальные попадания дают комбо-бонус. Следите за наклоном и не давайте котикам соскальзывать за края!</p>
      
      <div class="level-selector-box">
        <label>Стартовый Уровень:</label>
        <div class="levelButtons level-btn-group"></div>
      </div>

      <div class="start-btn-wrap">
        <button class="btn" id="startBtn">Играть</button>
        <button class="btn btn-secondary" id="resetProgressBtn" title="Сбросить сохранённый рекорд и чекпоинты">🗑️ Сброс</button>
      </div>
    </div>

    <div class="panel hidden" id="overPanel">
      <h1>Башня рухнула!</h1>
      <p id="finalScoreText">Счёт: 0</p>
      <p id="floorReachedText">Этаж: 0</p>
      <p id="bestScoreText">Рекорд: 0</p>

      <div class="level-selector-box">
        <label>Выбрать Уровень:</label>
        <div class="levelButtonsOver level-btn-group"></div>
      </div>

      <button class="btn" id="restartBtn">Ещё раз</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
