<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2140"/>
      <stop offset="100%" stop-color="#140e24"/>
    </linearGradient>
    <linearGradient id="cat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb6d9"/>
      <stop offset="100%" stop-color="#ff7da7"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#ffb6d9" stroke-width="8" stroke-opacity="0.3"/>
  
  <!-- Cat Base -->
  <g transform="translate(256, 270)">
    <!-- Ears -->
    <path d="M-130,-70 L-90,-160 L-30,-80 Z" fill="#ffb6d9"/>
    <path d="M-120,-70 L-90,-140 L-45,-80 Z" fill="#ff8fa3"/>
    <path d="M130,-70 L90,-160 L30,-80 Z" fill="#ffb6d9"/>
    <path d="M120,-70 L90,-140 L45,-80 Z" fill="#ff8fa3"/>
    
    <!-- Body -->
    <rect x="-140" y="-80" width="280" height="180" rx="36" fill="url(#cat)"/>
    
    <!-- Eyes -->
    <circle cx="-55" cy="-10" r="18" fill="#2a1520"/>
    <circle cx="-50" cy="-15" r="6" fill="#ffffff"/>
    <circle cx="55" cy="-10" r="18" fill="#2a1520"/>
    <circle cx="60" cy="-15" r="6" fill="#ffffff"/>
    
    <!-- Nose -->
    <path d="M-12,18 L12,18 L0,32 Z" fill="#ff4d79"/>
    
    <!-- Whiskers -->
    <path d="M-100,-5 L-150,-15 M-100,15 L-155,15 M-100,35 L-145,45" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <path d="M100,-5 L150,-15 M100,15 L155,15 M100,35 L145,45" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
